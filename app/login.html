<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Sign in · Cycle Planner</title>
<style>
  :root { --fg: #1d2125; --muted: #6b7280; --line: #e5e7eb; --accent: #d6336c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--fg); }
  body {
    display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;
    background: radial-gradient(circle at 20% 15%, #fbe3ec 0, transparent 45%), radial-gradient(circle at 85% 90%, #dbe9f7 0, transparent 50%), #eef1f4;
  }
  form { width: 100%; max-width: 340px; background: #fff; border-radius: 14px; padding: 26px 24px 22px; box-shadow: 0 4px 24px rgba(0,0,0,.12); }
  .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  .logo svg { flex: none; }
  h1 { font-size: 19px; margin: 0; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  input[type=text], input[type=password] {
    width: 100%; font: inherit; padding: 10px 11px; border: 1px solid #cfd4da; border-radius: 8px; outline: none;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(214,51,108,.15); }
  .remember { display: flex; align-items: center; gap: 7px; margin: 14px 0 18px; font-size: 13.5px; color: var(--fg); }
  .remember input { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }
  button { width: 100%; font: inherit; font-weight: 600; padding: 11px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
  button:hover { background: #c2255c; }
  .msg { font-size: 13.5px; border-radius: 8px; padding: 8px 10px; margin-bottom: 4px; }
  .msg.err { background: #fff0f0; color: #c92a2a; }
  .msg.ok { background: #ebfbee; color: #2b8a3e; }
</style>
</head>
<body>
<form method="post" action="/api/auth/login">
  <div class="logo">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
      <circle cx="8" cy="22" r="6" fill="none" stroke="#d6336c" stroke-width="2.4"/>
      <circle cx="26" cy="22" r="6" fill="none" stroke="#d6336c" stroke-width="2.4"/>
      <path d="M8 22 L14 12 L22 12 L26 22 M14 12 L18 22 L22 12 M12 9 h5" fill="none" stroke="#1d2125" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1>Cycle Planner</h1>
  </div>
  <div id="msg" class="msg" hidden></div>
  <label for="username">Username</label>
  <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <label class="remember"><input type="checkbox" name="remember" checked> Keep me signed in on this device</label>
  <input type="hidden" name="next" id="next" value="/">
  <button type="submit">Sign in</button>
</form>
<script>
  const q = new URLSearchParams(location.search);
  // A shared route link (#r=...) survives the trip through this page.
  const next = (q.get('next') || '/') + location.hash;
  document.getElementById('next').value = next;
  const msg = document.getElementById('msg');
  const say = (text, cls) => { msg.textContent = text; msg.className = 'msg ' + cls; msg.hidden = false; };
  if (q.get('error') === 'wrong') say('Wrong username or password.', 'err');
  else if (q.get('error') === 'locked') say('Too many wrong tries from here. Wait 15 minutes and try again.', 'err');
  else if (q.get('out')) say('Signed out.', 'ok');
  const user = document.getElementById('username');
  try { user.value = sessionStorage.getItem('cp-user') || ''; } catch (e) {}
  document.querySelector('form').addEventListener('submit', () => { try { sessionStorage.setItem('cp-user', user.value); } catch (e) {} });
  if (q.get('error')) { history.replaceState(null, '', location.pathname + location.hash); document.getElementById('password').focus(); }
  // Already signed in (or login is off)? Go straight to the planner.
  fetch('/api/auth/status').then((r) => r.json()).then((s) => { if (s.signed_in && !q.get('error')) location.replace(next); }).catch(() => {});
</script>
</body>
</html>
