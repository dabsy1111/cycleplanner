services:
  brouter:
    image: ghcr.io/dabsy1111/cycleplanner-brouter:latest
    restart: unless-stopped
    environment:
      TILES: E115_S35        # always kept; the app can download other regions on demand (More > Regions)
      REFRESH_DAYS: 7        # re-download OpenStreetMap routing data weekly
      JAVA_MAX_HEAP: 1g
    volumes:
      - ./data:/data

  history:
    image: ghcr.io/dabsy1111/cycleplanner-history:latest
    restart: unless-stopped
    environment:
      ICU_API_KEY: ""        # intervals.icu > Settings > Developer Settings > API key
      SYNC_HOURS: 6
      # Popularity heatmap proxy. {activity} {color} {z} {x} {y} are filled in. host.docker.internal
      # is the server itself; the proxy has to listen on 0.0.0.0 (not 127.0.0.1) for this to reach it.
      HEATMAP_URL: "http://host.docker.internal:8080/{activity}/{color}/{z}/{x}/{y}.png"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data

  web:
    image: ghcr.io/dabsy1111/cycleplanner-web:latest
    restart: unless-stopped
    depends_on:
      - brouter
      - history
    ports:
      - "8095:80"
