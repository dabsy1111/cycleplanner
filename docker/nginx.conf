server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/json application/javascript text/css application/gpx+xml;

    # Look BRouter up at request time so nginx starts even while BRouter is still downloading data.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $brouter http://brouter:17777;
    set $history http://history:8000;

    location /brouter {
        proxy_pass $brouter;
        proxy_read_timeout 120s;
    }

    location /api/history {
        proxy_pass $history;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
