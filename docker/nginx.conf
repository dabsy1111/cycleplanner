# Map tiles are cached here so the map keeps working (for places you've looked at)
# even if a free tile service is down. Lives inside the container: an Update starts it fresh.
proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=tiles:20m max_size=2g inactive=60d use_temp_path=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/json application/javascript text/css application/gpx+xml application/x-protobuf;

    # Long route requests (no-go lines, many waypoints) can exceed the default 8k URL limit.
    large_client_header_buffers 4 64k;

    # Look services up at request time so nginx starts even while they're still starting.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $brouter http://brouter:17777;
    set $history http://history:8000;
    set $ofm https://tiles.openfreemap.org;
    set $cyclosm https://a.tile-cyclosm.openstreetmap.fr;

    location /brouter {
        proxy_pass $brouter;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass $history;
        proxy_read_timeout 150s;
        client_max_body_size 2m;
    }

    # OpenFreeMap: tiles, fonts and sprites cached for 30 days, the style and tile index for an hour.
    location ~ ^/tiles/ofm/(.+\.(pbf|png|webp))$ {
        rewrite ^/tiles/ofm/(.*)$ /$1 break;
        proxy_pass $ofm;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host tiles.openfreemap.org;
        proxy_cache tiles;
        proxy_cache_valid 200 30d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        add_header X-Cache $upstream_cache_status;
    }
    location /tiles/ofm/ {
        rewrite ^/tiles/ofm/(.*)$ /$1 break;
        proxy_pass $ofm;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host tiles.openfreemap.org;
        proxy_cache tiles;
        proxy_cache_valid 200 1h;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        add_header X-Cache $upstream_cache_status;
    }

    location /tiles/cyclosm/ {
        rewrite ^/tiles/cyclosm/(.*)$ /cyclosm/$1 break;
        proxy_pass $cyclosm;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host a.tile-cyclosm.openstreetmap.fr;
        proxy_cache tiles;
        proxy_cache_valid 200 30d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        add_header X-Cache $upstream_cache_status;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
